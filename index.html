<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FCM - Career Manager</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0c121c;color:white;
 font-family:Arial,sans-serif
}
header{
 background:#151f2d;padding:18px;
 display:flex;justify-content:space-between;
 align-items:center
}
.logo{font-size:26px;font-weight:bold}
.logo span{color:#20d69a}
.container{max-width:850px;margin:auto;padding:13px}
.card{
 background:#172231;border:1px solid #2b394b;
 border-radius:12px;padding:15px;margin-bottom:13px
}
h2,h3{margin-top:0}
.muted{color:#91a0b3;font-size:13px}
button,select{font-size:15px}
button{
 border:0;border-radius:8px;padding:12px;
 cursor:pointer
}
.primary{background:#20d69a;color:#06150f;font-weight:bold}
.secondary{background:#29384c;color:white}
select{
 width:100%;padding:12px;background:#0e1927;
 color:white;border:1px solid #34445a;
 border-radius:8px;margin:8px 0 14px
}
.grid{
 display:grid;grid-template-columns:repeat(2,1fr);gap:10px
}
.club{
 background:#223044;color:white;
 border:1px solid #3b4c62;padding:13px;
 text-align:center;border-radius:10px
}
.club.selected{border:2px solid #20d69a}
.crest{
 width:45px;height:45px;border-radius:50%;
 margin:0 auto 8px;display:grid;place-items:center;
 font-weight:bold
}
.hidden{display:none!important}
nav{display:flex;gap:7px;overflow-x:auto;margin:13px 0}
nav button{background:#253348;color:white;white-space:nowrap}
nav button.active{background:#20d69a;color:#06150f}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:#223044;padding:12px;border-radius:9px}
.stat small{color:#9eacc0}
.stat strong{display:block;font-size:22px;margin-top:5px}
.players{
 display:grid;grid-template-columns:repeat(2,1fr);gap:9px
}
.player{
 background:#223044;border-radius:10px;
 overflow:hidden;text-align:center;padding-bottom:10px
}
.player img{
 width:100%;height:125px;object-fit:cover;
 background:#34445a
}
.player .number{color:#20d69a;font-weight:bold}
.player b{display:block;font-size:13px;padding:5px}
.player small{color:#aab8ca}
.match{
 display:flex;justify-content:space-between;
 align-items:center;background:#223044;
 padding:13px;border-radius:8px;margin:8px 0
}
.pitch{
 background:repeating-linear-gradient(
  0deg,#17613e,#17613e 60px,
  #1d7048 60px,#1d7048 120px
 );
 border:2px solid white;border-radius:8px;
 height:390px;position:relative;overflow:hidden
}
.pitch:after{
 content:"";position:absolute;left:0;right:0;top:50%;
 border-top:2px solid white
}
.position{
 position:absolute;transform:translate(-50%,-50%);
 background:#10251b;border:2px solid white;
 border-radius:8px;padding:6px 3px;
 width:65px;text-align:center;font-size:10px
}
.position b{color:#20d69a;display:block}
footer{text-align:center;color:#8998ac;padding:20px}
@media(max-width:400px){
 .player img{height:105px}
}
</style>
</head>

<body>

<header>
 <div class="logo">FC<span>M</span></div>
 <small>BY HWTA</small>
</header>

<div class="container">

<section id="start">

 <div class="card">
  <h2>FOOTBALL CAREER</h2>
  <p class="muted">Choose your Spanish club.</p>

  <div id="clubs" class="grid"></div>

  <br>
  <button class="primary" id="startBtn" style="width:100%">
   START CAREER
  </button>

  <br><br>
  <button class="secondary" id="continueBtn" style="width:100%">
   CONTINUE CAREER
  </button>

  <p id="message" class="muted"></p>
 </div>

</section>

<section id="game" class="hidden">

 <div class="card">
  <h2 id="clubName"></h2>
  <div class="stats">
   <div class="stat"><small>Played</small><strong id="played">0</strong></div>
   <div class="stat"><small>Points</small><strong id="points">0</strong></div>
  </div>
 </div>

 <nav>
  <button class="active" data-tab="home">HOME</button>
  <button data-tab="squad">SQUAD</button>
  <button data-tab="tactics">TACTICS</button>
  <button data-tab="matches">MATCHES</button>
  <button data-tab="table">TABLE</button>
 </nav>

 <div id="homeTab" class="tab">
  <div class="card">
   <h3>NEXT MATCH</h3>
   <div id="nextMatch"></div>
   <button class="primary" id="playBtn" style="width:100%">
    PLAY MATCH
   </button>
  </div>

  <div class="card">
   <h3>CLUB INFORMATION</h3>
   <p class="muted" id="clubInfo"></p>
  </div>
 </div>

 <div id="squadTab" class="tab hidden">
  <div class="card">
   <h3>FIRST TEAM PLAYERS</h3>
   <div id="players" class="players"></div>
  </div>
 </div>

 <div id="tacticsTab" class="tab hidden">
  <div class="card">
   <h3>FORMATION</h3>
   <select id="formation">
    <option>4-3-3</option>
    <option>4-2-3-1</option>
    <option>4-4-2</option>
   </select>

   <h3>PLAYING STYLE</h3>
   <select id="style">
    <option>Possession</option>
    <option>High Pressing</option>
    <option>Counter Attack</option>
    <option>Balanced</option>
   </select>
  </div>

  <div class="card">
   <h3>FORMATION PREVIEW</h3>
   <div class="pitch" id="pitch"></div>
  </div>
 </div>

 <div id="matchesTab" class="tab hidden">
  <div class="card">
   <h3>MATCH HISTORY</h3>
   <div id="history"></div>
  </div>
 </div>

 <div id="tableTab" class="tab hidden">
  <div class="card">
   <h3>LA LIGA TABLE</h3>
   <div id="table"></div>
  </div>
 </div>

 <button class="secondary" id="backBtn">BACK TO MENU</button>

</section>

</div>

<footer>FCM · FOOTBALL CAREER MANAGER</footer>

<script>
"use strict";

const clubs=[
 {name:"Barcelona",code:"BAR",color:"#a50044"},
 {name:"Real Madrid",code:"RMA",color:"#d6b64c"},
 {name:"Real Betis",code:"BET",color:"#168c56"},
 {name:"Espanyol",code:"ESP",color:"#2871bb"},
 {name:"Getafe",code:"GET",color:"#2460a7"},
 {name:"Atletico Madrid",code:"ATM",color:"#bd202b"},
 {name:"Athletic Bilbao",code:"ATH",color:"#d52b35"}
];

const barcelonaPlayers=[
 ["Joan Garcia","GK",13,80,5,0],
 ["Wojciech Szczesny","GK",25,80,0,0],
 ["Alejandro Balde","LB",3,82,1,0],
 ["Ronald Araujo","CB",4,84,2,0],
 ["Pau Cubarsi","CB",5,83,3,0],
 ["Jules Kounde","RB",23,85,4,0],
 ["Eric Garcia","CB",24,80,5,1],
 ["Gerard Martin","LB",18,78,4,1],
 ["Andreas Christensen","CB",15,82,1,1],
 ["Pedri","CM",8,91,1,2],
 ["Frenkie de Jong","CM",21,88,2,2],
 ["Gavi","CM",6,85,3,2],
 ["Dani Olmo","CAM",20,86,4,2],
 ["Marc Casado","CDM",17,80,5,2],
 ["Fermin Lopez","CM",16,84,0,3],
 ["Raphinha","LW",11,89,1,3],
 ["Lamine Yamal","RW",10,92,2,3],
 ["Robert Lewandowski","ST",9,87,3,3],
 ["Ferran Torres","ST",7,83,4,3],
 ["Marcus Rashford","LW",14,84,5,3],
 ["Roony Bardghji","RW",28,77,0,0],
 ["Marc Bernal","CDM",22,78,1,0]
];

const otherNames=[
 "Alex Morgan","Daniel Silva","Lucas Martin","David Costa",
 "Marco Rossi","Samuel Garcia","Leo Santos","Adam Wilson",
 "Ryan Walker","Noah Brown","Thomas Miller","Gabriel Lopez",
 "Mateo Fernandez","Ethan Clarke","Oliver Scott","Luis Romero",
 "Carlos Diaz","Nico Alvarez","Victor Torres","Ben Carter",
 "Andreas Meyer","Julian Weber"
];

let selected=null;
let career=null;

const $=id=>document.getElementById(id);

function showClubs(){
 $("clubs").innerHTML="";

 clubs.forEach(club=>{
  const button=document.createElement("button");
  button.className="club";
  button.innerHTML=
   '<div class="crest" style="background:'+club.color+'">'+
   club.code+'</div><b>'+club.name+'</b>';

  button.onclick=()=>{
   selected=club;
   document.querySelectorAll(".club").forEach(x=>
    x.classList.remove("selected")
   );
   button.classList.add("selected");
   $("message").textContent="Selected: "+club.name;
  };

  $("clubs").appendChild(button);
 });
}

function createPlayers(){
 if(selected.name==="Barcelona"){
  return barcelonaPlayers.map((p,i)=>({
   name:p[0],position:p[1],number:p[2],
   rating:p[3],col:p[4],row:p[5],image:true
  }));
 }

 return otherNames.map((name,i)=>({
  name:name,
  position:["GK","GK","LB","CB","CB","RB","CB","LB",
  "RB","CDM","CM","CM","CAM","CM","CDM","LW","RW",
  "ST","ST","LW","RW","ST"][i],
  number:i+1,
  rating:70+(i%12),
  image:false
 }));
}

function startCareer(){
 if(!selected){
  $("message").textContent="Choose a club first.";
  return;
 }

 career={
  club:selected.name,
  players:createPlayers(),
  played:0,
  points:0,
  wins:0,
  draws:0,
  losses:0,
  index:0,
  history:[],
  table:clubs.map(c=>({
   name:c.name,p:0,w:0,d:0,l:0,pts:0
  }))
 };

 openGame();
}

function openGame(){
 $("start").classList.add("hidden");
 $("game").classList.remove("hidden");
 $("clubName").textContent=career.club;
 update();
}

function save(){
 if(career){
  localStorage.setItem("FCM_SIMPLE",JSON.stringify(career));
 }
}

function load(){
 try{
  const data=localStorage.getItem("FCM_SIMPLE");
  if(!data)throw Error();
  career=JSON.parse(data);
  openGame();
 }catch(e){
  $("message").textContent="No saved career found.";
 }
}

function update(){
 $("played").textContent=career.played;
 $("points").textContent=career.points;
 $("clubInfo").textContent=
  career.club+" · Spanish League · "+career.players.length+" players";

 const opponents=clubs.filter(c=>c.name!==career.club);
 const opponent=opponents[career.index%opponents.length];

 $("nextMatch").innerHTML=
  '<div class="match"><b>'+career.club+'</b><b>VS</b><b>'+
  opponent.name+'</b></div>';

 renderPlayers();
 renderPitch();
 renderHistory();
 renderTable();
 save();
}

function renderPlayers(){
 $("players").innerHTML="";

 career.players.forEach(p=>{
  const card=document.createElement("div");
  card.className="player";

  let photo="";

  if(p.image){
   photo=
   '<div class="photo" style="height:125px;background-image:url(https://www.diez.hn/binrepository/960x1200/0c0/0d0/none/3014757/YCOT/g0kja5ww4aajcu7_11886032_20250906101539.jpg);background-size:600% 400%;background-position:'+
   (p.col*20)+'% '+(p.row*33.333)+'%"></div>';
  }else{
   photo='<div style="height:125px;background:#34445a;display:grid;place-items:center;font-size:28px;color:#aab8ca">FCM</div>';
  }

  card.innerHTML=
   photo+
   '<div class="number">#'+p.number+'</div>'+
   '<b>'+p.name+'</b>'+
   '<small>'+p.position+' · '+p.rating+'</small>';

  $("players").appendChild(card);
 });
}

function renderPitch(){
 const pitch=$("pitch");
 pitch.innerHTML="";

 let positions=[
  [20,20],[50,12],[80,20],
  [35,40],[65,40],[50,55],
  [15,75],[38,80],[62,80],[85,75],[50,94]
 ];

 positions.forEach((pos,i)=>{
  const p=career.players[i];
  const el=document.createElement("div");
  el.className="position";
  el.style.left=pos[0]+"%";
  el.style.top=pos[1]+"%";
  el.innerHTML="<b>"+p.number+"</b>"+p.name.split(" ")[0];
  pitch.appendChild(el);
 });
}

function playMatch(){
 const opponents=clubs.filter(c=>c.name!==career.club);
 const opponent=opponents[career.index%opponents.length];

 let strength=career.players.reduce((a,p)=>a+p.rating,0)/career.players.length;
 let bonus=$("style").value==="Possession"?2:
 $("style").value==="High Pressing"?3:0;

 let home=Math.floor(Math.random()*4)+Math.floor((strength+bonus)/30);
 let away=Math.floor(Math.random()*4)+1;

 let result=home>away?"W":home===away?"D":"L";

 career.played++;

 if(result==="W"){
  career.wins++;
  career.points+=3;
 }else if(result==="D"){
  career.draws++;
  career.points++;
 }else{
  career.losses++;
 }

 let own=career.table.find(t=>t.name===career.club);
 let rival=career.table.find(t=>t.name===opponent.name);

 own.p++;rival.p++;

 if(result==="W"){
  own.w++;own.pts+=3;rival.l++;
 }else if(result==="D"){
  own.d++;rival.d++;own.pts++;rival.pts++;
 }else{
  own.l++;rival.w++;rival.pts+=3;
 }

 career.history.unshift({
  opponent:opponent.name,
  home:home,
  away:away
 });

 career.index++;
 update();

 showTab("matches",document.querySelector('[data-tab="matches"]'));
}

function renderHistory(){
 $("history").innerHTML="";

 if(!career.history.length){
  $("history").textContent="No matches played.";
  return;
 }

 career.history.forEach(m=>{
  const row=document.createElement("div");
  row.className="match";
  row.innerHTML=
   "<b>"+career.club+"</b>"+
   "<strong>"+m.home+" - "+m.away+"</strong>"+
   "<b>"+m.opponent+"</b>";
  $("history").appendChild(row);
 });
}

function renderTable(){
 $("table").innerHTML="";

 [...career.table]
 .sort((a,b)=>b.pts-a.pts||b.w-a.w)
 .forEach((t,i)=>{
  const row=document.createElement("div");
  row.className="match";
  row.innerHTML=
   "<b>"+(i+1)+". "+t.name+"</b>"+
   "<span>"+t.p+" MP</span>"+
   "<strong>"+t.pts+" PTS</strong>";
  $("table").appendChild(row);
 });
}

function showTab(name,button){
 document.querySelectorAll(".tab").forEach(t=>
  t.classList.add("hidden")
 );
 $(name+"Tab").classList.remove("hidden");

 document.querySelectorAll("nav button").forEach(b=>
  b.classList.remove("active")
 );
 button.classList.add("active");
}

function back(){
 save();
 $("game").classList.add("hidden");
 $("start").classList.remove("hidden");
}

document.addEventListener("DOMContentLoaded",()=>{
 showClubs();

 $("startBtn").onclick=startCareer;
 $("continueBtn").onclick=load;
 $("playBtn").onclick=playMatch;
 $("backBtn").onclick=back;

 document.querySelectorAll("nav button").forEach(button=>{
  button.onclick=()=>showTab(button.dataset.tab,button);
 });

 $("formation").onchange=()=>{
  renderPitch();
  save();
 };

 $("style").onchange=save;
});
</script>

</body>
 </html>
